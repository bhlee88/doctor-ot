<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b70"><link rel="manifest" href="manifest.webmanifest"><title>닥터 OT</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#15263e;margin:0}main{max-width:620px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #15263e0b}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d5dfea;box-sizing:border-box}input{width:100%;margin:5px 0 12px}button{background:#173b70;color:white;border:0;cursor:pointer}button.secondary{background:#e9eff8;color:#173b70}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#6d7d90;font-size:13px}.entry{border-top:1px solid #eee;padding:12px 0}.hidden{display:none}.error{color:#b42318;white-space:pre-wrap}h1{font-size:23px}h2{font-size:18px}small{color:#6d7d90}.hospital-brand{background:#fff;border-radius:14px;padding:14px 18px;margin:0 0 14px;box-shadow:0 2px 12px #15263e0b}.hospital-brand img{display:block;width:100%;height:auto;max-height:110px;object-fit:contain}@media(max-width:480px){.hospital-brand{padding:12px}.hospital-brand img{max-height:76px}}</style></head><body><main><header><h1>🕒 닥터 OT</h1><button id="logout" class="secondary hidden">로그아웃</button></header><p id="status" class="muted">연결 중…</p><section id="login"><h2>의사 로그인</h2><form id="loginForm"><label>이메일<input id="email" type="email" required autocomplete="username"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form><p><button type="button" id="showJoin" class="secondary">초대 코드로 새 계정 만들기</button></p></section><section id="join" class="hidden"><h2>초대 코드로 가입</h2><p class="muted">관리자에게 받은 초대 코드가 있어야 가입할 수 있습니다.</p><form id="joinForm"><label>의사 이름 (관리자가 등록한 이름과 동일)<input id="joinName" required maxlength="60"></label><label>초대 코드<input id="joinCode" required autocomplete="off" placeholder="초대 코드"></label><label>이메일<input id="joinEmail" type="email" required autocomplete="email"></label><label>비밀번호 (6자 이상)<input id="joinPassword" type="password" minlength="6" required autocomplete="new-password"></label><button id="joinButton">가입하고 참여하기</button></form><p class="muted">이미 계정을 만들었지만 참여가 완료되지 않았다면, 같은 이메일로 로그인한 뒤 초대 코드를 입력할 수 있습니다.</p></section><section id="redeem" class="hidden"><h2>병원 참여</h2><p class="muted">아직 병원에 등록되지 않은 계정입니다. 초대 코드를 입력해 주세요.</p><form id="redeemForm"><label>의사 이름<input id="redeemName" required maxlength="60"></label><label>초대 코드<input id="redeemCode" required autocomplete="off"></label><button>초대 코드 사용</button></form></section><div id="app" class="hidden"><section id="adminPanel" class="hidden"><h2>의사 초대 코드 발급</h2><p class="muted">한 사람에게만 전달하세요. 코드는 한 번만 사용할 수 있습니다.</p><form id="inviteForm"><label>초대할 의사 이름<input id="inviteName" required maxlength="60" placeholder="예: 김의사"></label><button>일회용 코드 생성</button></form><div id="inviteResult" class="hidden"><p>발급한 초대 코드</p><strong id="inviteCode" style="overflow-wrap:anywhere"></strong><p><button id="copyInvite" type="button" class="secondary">코드 복사</button></p></div></section><section><div class="row"><h2>월별 현황</h2><input id="month" type="month" style="width:160px"></div><p id="total"></p><div id="ranking"></div></section><section><h2 id="formTitle">OT 기록 추가</h2><form id="otForm"><label>날짜<input id="date" type="date" required></label><label>초과 근무 (분)<input id="minutes" type="number" min="1" max="1440" step="1" required></label><div class="row"><button id="save">기록 저장</button><button type="button" class="secondary hidden" id="cancel">수정 취소</button></div></form></section><section><h2>전체 기록</h2><div id="entries"></div></section></div><p id="error" class="error"></p></main><script type="module" src="app.js?v=2"></script></body></html>
